AWSTemplateFormatVersion: "2010-09-09"
Description: Cost-conscious Wan 2.2 image-to-video jobs on AWS Batch Spot

Parameters:
  BucketName:
    Type: String
    Description: Existing S3 bucket containing manifests, inputs, and outputs
  ContainerImage:
    Type: String
    Description: Full ECR image URI including tag
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets with outbound internet access (public, or private with NAT)
  SpotBidPercentage:
    Type: Number
    Default: 70
    MinValue: 1
    MaxValue: 100
    Description: Maximum Spot price as a percentage of On-Demand

Resources:
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound access for Dance Now AWS Batch workers
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BatchInstanceRole

  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: spotfleet.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DanceNowBucketObjects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}/dance-now/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${BucketName}
                Condition:
                  StringLike:
                    s3:prefix: "dance-now/*"

  WorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: 150
              VolumeType: gp3
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: SPOT
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: 8
        AllocationStrategy: SPOT_PRICE_CAPACITY_OPTIMIZED
        BidPercentage: !Ref SpotBidPercentage
        InstanceTypes:
          - g5.2xlarge
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        Ec2Configuration:
          - ImageType: ECS_AL2_NVIDIA
        LaunchTemplate:
          LaunchTemplateId: !Ref WorkerLaunchTemplate
          Version: !GetAtt WorkerLaunchTemplate.LatestVersionNumber
        Tags:
          Project: dance-now
          Workload: image-to-video

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 2
      Timeout:
        AttemptDurationSeconds: 21600
      ContainerProperties:
        Image: !Ref ContainerImage
        JobRoleArn: !GetAtt JobRole.Arn
        ResourceRequirements:
          - Type: GPU
            Value: "1"
          - Type: VCPU
            Value: "8"
          - Type: MEMORY
            Value: "30000"
        LinuxParameters:
          SharedMemorySize: 8192
        Environment:
          - Name: MODEL_ID
            Value: Wan-AI/Wan2.2-TI2V-5B
          - Name: MODEL_DIR
            Value: /models/Wan2.2-TI2V-5B
          - Name: SKIP_EXISTING
            Value: "true"

Outputs:
  JobQueue:
    Value: !Ref JobQueue
  JobDefinition:
    Value: !Ref JobDefinition
  ComputeEnvironment:
    Value: !Ref ComputeEnvironment

