[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dance-now"
version = "0.1.0"
description = "Cost-conscious AWS Batch image-to-video generation"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34,<2", "Pillow>=10,<12"]

[project.scripts]
dance-now-submit = "dance_now.submit:main"

[tool.setuptools.packages.find]
where = ["src"]
